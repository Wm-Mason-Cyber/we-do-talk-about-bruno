name: test

# Servers run whatever is on main after a `git pull`, so keep main green
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # What setup.sh installs from PyPI (requirements.txt)
          - name: pinned (3.11)
            python: "3.11"
            deps: -r requirements.txt httpx
          - name: pinned (3.13)
            python: "3.13"
            deps: -r requirements.txt httpx
          # setup.sh's fallback: Debian 12 / Raspberry Pi OS apt packages
          - name: debian-12 apt versions
            python: "3.11"
            deps: fastapi==0.92.0 pydantic==1.10.18 uvicorn==0.17.6 httpx==0.27.2
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.deps }} pytest
      - run: python -m pytest test_server.py -v
      - run: bash -n setup.sh && bash -n install-service.sh
