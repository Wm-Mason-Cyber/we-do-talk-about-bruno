# nginx front door for the Roster API (Bruno lab)
#
#   :5000 and :80  →  uvicorn on 127.0.0.1:8000
#   /logs/access   →  raw access log as text (FRQ-style log reading)
#   /logs/errors   →  raw error log as text

# Standard combined format — matches what AP FRQ materials reference
log_format lab '$remote_addr - $remote_user [$time_local] '
               '"$request" $status $body_bytes_sent '
               '"$http_referer" "$http_user_agent"';

upstream bruno_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 5000 default_server;
    listen 80   default_server;
    server_name _;

    # Lets you prove a response came from this box and not another server on the same IP
    add_header X-Served-By bruno-api always;

    access_log /var/log/bruno-api/access.log lab;
    error_log  /var/log/bruno-api/error.log  warn;

    # Student names are tiny; anything bigger is someone experimenting
    client_max_body_size 4k;

    location = /logs/access {
        alias /var/log/bruno-api/access.log;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }
    location = /logs/errors {
        alias /var/log/bruno-api/error.log;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    # Live dashboard stream: never buffer, keep the connection open
    location = /dashboard/events {
        proxy_pass http://bruno_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://bruno_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
